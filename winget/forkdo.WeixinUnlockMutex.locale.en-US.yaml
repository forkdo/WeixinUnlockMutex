ShortDescription: Tool to unlock WeChat mutex for multiple instances
Description: |-
  WeChatPC is a technical research tool designed to enable multiple instances of the WeChat PC client 
  to run simultaneously by bypassing the built-in single-instance restriction. It leverages Windows 
  system-level handle manipulation to achieve this.
  
  Features:
  - Supports unlimited multi-opening of WeChat
  - One-click launch of WeChat instances  
  - Uses advanced Windows API handle operations
  - Safe and reliable, no third-party tools required
  - Portable single-file execution
