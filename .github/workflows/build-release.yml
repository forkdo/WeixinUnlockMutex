name: Build and Release MSI

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup Windows SDK
      run: |
        # List available Windows SDK versions
        Write-Host "Available Windows SDK versions:"
        $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
        if (Test-Path $sdkPath) {
          Get-ChildItem $sdkPath -Directory | Sort-Object Name -Descending | ForEach-Object { Write-Host $_.Name }
        }
      shell: powershell
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
        
    - name: Install WiX v6
      run: |
        dotnet tool install --global wix --version 6.0.0
        dotnet tool list --global
      shell: powershell
      
    - name: Build x86 Release
      run: |
        # Build with the latest available Windows SDK
        msbuild WeChatPC.sln /p:Configuration=Release /p:Platform=x86 /p:OutputPath=..\Release\ /p:WindowsTargetPlatformVersion=10.0
      working-directory: .
      
    - name: Create MSI Installer
      run: |
        # Create output directory
        if (!(Test-Path "obj")) { New-Item -ItemType Directory -Path "obj" }
        
        # Build MSI using WiX v6
        wix build WeChatPC.wxs -out "WeChatPC-${{ github.ref_name }}.msi"
      shell: powershell
      
    - name: Update WinGet Manifests
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # Update WinGet manifests with new version and MSI hash using PowerShell 7
        pwsh -File .\Update-WingetManifest.ps1 -Version "${{ github.ref_name }}" -MSIPath "WeChatPC-${{ github.ref_name }}.msi"
        
        Write-Host "WinGet manifests updated locally for release"
      shell: pwsh
      
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          WeChatPC-${{ github.ref_name }}.msi
          Release/WeChatPC.exe
          winget/forkdo.WeixinUnlockMutex.yaml
          winget/forkdo.WeixinUnlockMutex.installer.yaml
          winget/forkdo.WeixinUnlockMutex.locale.en-US.yaml
          winget/forkdo.WeixinUnlockMutex.locale.zh-CN.yaml
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}